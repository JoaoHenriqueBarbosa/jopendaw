[package]
name = "jopendaw-engine-android"
description = "O motor exposto em funções C para o app Android (dart:ffi): thread de áudio do AAudio, filas sem trava, decodificação e render fora de tempo real."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# libjopendaw_engine.so, o nome que o Dart abre com DynamicLibrary.open
name = "jopendaw_engine"
crate-type = ["cdylib"]

[dependencies]
jopendaw-engine = { path = ".." }
# fila de comandos (thread do Dart → thread de áudio) e a de lixo (a volta), sem trava nem alocação
rtrb = "0.4"
# estado publicado pela thread de áudio (posição, espectro) sem trava
triple_buffer = "9"
serde = "1"
serde_json = "1"
libc = "0.2"
# os formatos que o navegador decodifica e o jopendaw importa (sem Opus: o symphonia não tem)
symphonia = { version = "0.5.5", default-features = false, features = [
  "wav",
  "aiff",
  "caf",
  "pcm",
  "adpcm",
  "flac",
  "mp3",
  "ogg",
  "vorbis",
  "aac",
  "isomp4",
  "alac",
  "opt-simd",
] }

[target.'cfg(target_os = "android")'.dependencies]
# só para listar as entradas de áudio (AudioManager.getDevices); o áudio em si é o AAudio em C
jni = { version = "0.21", default-features = false }
