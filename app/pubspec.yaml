name: jopendaw_app
description: "jopendaw, o DAW: build web e app Android do mesmo código."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^18.0.1
  web: ^1.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^5.1.0
  file_picker: ^13.1.0
  ffi: ^2.2.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  flutter_midi_command: ^1.3.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # testes no emulador ou no aparelho (integration_test/): o motor nativo tocando de verdade
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
